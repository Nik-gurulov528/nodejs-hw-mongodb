tags:
  - auth
summary: reset your password
operationId: resetPassword
description: If you want to reset your password, you need to use this operation
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            type: string
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiIxMjM0NTYiLCJyb2xlIjoiYWRtaW4iLCJpYXQiOjE2NjAwMDAwMDAsImV4cCI6MTY2MDA4NjQwMH0.K1pHeF3Vt7lN3VnIUjKfDlF9S4BZrKzHeXzMxPkhRUU'
          password:
            type: string
            description: New password
responses:
  '200':
    description: 'Resets password'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Password has been successfully reset.'
            data:
              type: object
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'

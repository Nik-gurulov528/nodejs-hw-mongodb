tags:
  - auth
summary: login in user account
operationId: authLogin
description: Before start to work, you should login
security: []
requestBody:
  content:
    raw:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: User's email
            type: string
            example: 'vlad096@gmail.com'
          password:
            description: User's password
            type: string
responses:
  '200':
    description: 'Logins user'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in an user!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'q8F3LbY9RmZw6uHd2jKXrEVpPsbGmY'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'

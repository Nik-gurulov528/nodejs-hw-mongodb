tags:
  - auth
summary: Register new user
operationId: authRegister
description: Before start to work, you should register first
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: User's name
            type: string
            example: 'Vladislav Nikulin'
          email:
            description: User's email
            type: string
            example: 'vlad096@gmail.com'
          password:
            description: User's password
            type: string
responses:
  '201':
    description: 'Registers user'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully registered a user!'
            data:
              type: object
              $ref: '../../../components/schemas/user.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '409':
    $ref: '../../../components/responses/409.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'

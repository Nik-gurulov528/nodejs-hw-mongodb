tags:
  - contacts
summary: Get list of user's contacts
operationId: getAllContacts
description: If you need to get the list of user's contacts, then use this operation
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 4
      default: 1
  - in: query
    name: perPage
    schema:
      type: integer
      example: 25
      default: 10
  - in: query
    name: sortBy
    schema:
      type: string
      example: 'name'
      enum:
        ['_id', 'name', 'phoneNumber', 'email', 'isFavourite', 'contactType']
  - in: query
    name: sortOrder
    schema:
      type: string
      example: 'desc'
      enum: ['asc', 'desc']
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: true
  - in: query
    name: contactType
    schema:
      type: string
      example: 'work'
      enum: ['home', 'work', 'personal']
responses:
  '200':
    description: 'Get list of contacts'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contacts!'
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasPreviousPage
                - hasNextPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: number
                  example: 1
                perPage:
                  type: number
                  example: 15
                totalItems:
                  type: number
                  example: 45
                totalPages:
                  type: number
                  example: 3
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'

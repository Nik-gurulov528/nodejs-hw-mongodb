openapi: 3.1.0
info:
  version: 1.0.0
  title: contactsaver
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: If you need to save your contacts, then you can use this app to make your live easier
tags:
  - name: contacts
    description: operations with contacts
  - name: auth
    description: operations with auth

servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-ye3b.onrender.com
  - url: http://127.0.0.1:3000
paths:
  /contacts/{id}:
    get:
      $ref: '../swagger/paths/contacts/{id}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{id}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{id}/delete.yaml'
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'
  /auth/register:
    post:
      $ref: '../swagger/paths/auth/register/register.yaml'
  /auth/login:
    post:
      $ref: '../swagger/paths/auth/login/login.yaml'
  /auth/refresh:
    post:
      $ref: '../swagger/paths/auth/refresh/refresh.yaml'
  /auth/logout:
    post:
      $ref: '../swagger/paths/auth/logout/logout.yaml'
  /auth/send-reset-email:
    post:
      $ref: '../swagger/paths/auth/send-reset-email/send-reset-email.yaml'
  /auth/reset-pwd:
    post:
      $ref: '../swagger/paths/auth/reset-pwd/reset-pwd.yaml'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
